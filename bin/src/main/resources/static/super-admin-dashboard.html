<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin | VNext Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .sidebar { background: #0f172a; min-height: 100vh; }
        .nav-item:hover { background: #1e293b; border-radius: 0.75rem; }
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; }
        .card-hover:hover { transform: translateY(-2px); transition: 0.2s; }
    </style>
    <script>
        const API_BASE = '/api';
        let token = localStorage.getItem('accessToken');
        if (!token) window.location.href = 'index.html';
        if (localStorage.getItem('userRole') !== 'SUPER_ADMIN') window.location.href = 'index.html';
        let currentPage = 0, totalPages = 0, currentStatusFilter = '';
        let companiesChart = null;

        function getHeaders() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }; }
        async function apiFetch(url, opts={}) {
            const res = await fetch(API_BASE + url, { ...opts, headers: getHeaders() });
            if (res.status === 401) { localStorage.clear(); window.location.href='index.html'; throw new Error('Session expired'); }
            const json = await res.json();
            if (!json.success) throw new Error(json.error || json.message);
            return json.data;
        }
        function showToast(msg, type='success') { const t=document.createElement('div'); t.className=`fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-lg text-white ${type==='success'?'bg-green-600':'bg-red-600'}`; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
        function logout() { localStorage.clear(); window.location.href='index.html'; }
        function formatDate(d) { return d ? new Date(d).toLocaleString() : '—'; }

        async function loadStats() {
            try {
                const stats = await apiFetch('/super-admin/stats');
                document.getElementById('totalCompanies').innerText = stats.totalCompanies || 0;
                document.getElementById('activeCompanies').innerText = stats.activeCompanies || 0;
                document.getElementById('inactiveCompanies').innerText = stats.deactivatedCompanies || 0;
                if (companiesChart) companiesChart.destroy();
                const ctx = document.getElementById('statsChart').getContext('2d');
                companiesChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Active', 'Deactivated'], datasets: [{ data: [stats.activeCompanies||0, stats.deactivatedCompanies||0], backgroundColor: ['#3b82f6','#ef4444'] }] } });
            } catch(e) { console.error(e); }
        }

        async function loadCompanies(page=0, status='') {
            currentPage = page; currentStatusFilter = status;
            let url = `/super-admin/companies?page=${page}&size=8&sortBy=createdAt&sortDir=desc`;
            if (status) url += `&status=${status}`;
            try {
                const data = await apiFetch(url);
                totalPages = data.totalPages;
                document.getElementById('pageInfo').innerText = `Page ${data.number+1} of ${data.totalPages}`;
                const tbody = document.getElementById('companiesTableBody');
                tbody.innerHTML = '';
                data.content.forEach(c => {
                    let statusBadge = '';
                    if (c.status === 'ACTIVE') statusBadge = 'bg-green-100 text-green-700';
                    else if (c.status === 'PENDING') statusBadge = 'bg-yellow-100 text-yellow-700';
                    else statusBadge = 'bg-red-100 text-red-700';
                    const row = `<tr class="border-b hover:bg-slate-50">
                        <td class="p-3 font-medium">${c.name}</td><td class="p-3">${c.email}</td><td class="p-3">${c.employeeLimit || '-'}/${c.currentEmployeeCount || 0}</td>
                        <td class="p-3"><span class="badge ${statusBadge}">${c.status}</span></td><td class="p-3">${c.documentsVerified ? '<i class="fas fa-check-circle text-green-500"></i> Yes' : '<i class="fas fa-times-circle text-red-400"></i> No'}</td>
                        <td class="p-3">${formatDate(c.subscriptionEndDate)}</td><td class="p-3 flex gap-2">
                        <button onclick="viewCompany(${c.id})" class="text-blue-600 hover:bg-blue-50 p-1 rounded"><i class="fas fa-eye"></i></button>
                        <button onclick="openStatusModal(${c.id}, '${c.status}')" class="text-amber-600 hover:bg-amber-50 p-1 rounded"><i class="fas fa-toggle-on"></i></button>
                        <button onclick="openExtendModal(${c.id})" class="text-purple-600 hover:bg-purple-50 p-1 rounded"><i class="fas fa-calendar-plus"></i></button>
                        <button onclick="openEmployeeLimitModal(${c.id})" class="text-indigo-600 hover:bg-indigo-50 p-1 rounded"><i class="fas fa-users"></i></button>
                        <button onclick="verifyDocs(${c.id})" class="text-green-600 hover:bg-green-50 p-1 rounded"><i class="fas fa-file-alt"></i></button>
                    </tr>`;
                    tbody.innerHTML += row;
                });
                document.getElementById('prevBtn').disabled = page === 0;
                document.getElementById('nextBtn').disabled = page+1 >= totalPages;
            } catch(err) { showToast(err.message,'error'); }
        }

        async function viewCompany(id) {
            try {
                const company = await apiFetch(`/super-admin/companies/${id}`);
                document.getElementById('modalTitle').innerText = `Company: ${company.name}`;
                document.getElementById('companyDetail').innerHTML = `<div class="grid grid-cols-2 gap-3 text-sm"><div><strong>Email:</strong> ${company.email}</div><div><strong>Phone:</strong> ${company.phone||'—'}</div><div><strong>Address:</strong> ${company.address||''} ${company.city||''} ${company.country||''}</div><div><strong>Status:</strong> ${company.status}</div><div><strong>Employee limit:</strong> ${company.employeeLimit}</div><div><strong>Subscription:</strong> ${formatDate(company.subscriptionStartDate)} to ${formatDate(company.subscriptionEndDate)}</div><div><strong>Documents Verified:</strong> ${company.documentsVerified ? 'Yes' : 'No'}</div><div><strong>Company Admin:</strong> ${company.companyAdmin?.firstName} ${company.companyAdmin?.lastName} (${company.companyAdmin?.email})</div></div>`;
                document.getElementById('companyModal').classList.remove('hidden');
            } catch(e) { showToast(e.message,'error'); }
        }
        
        function closeModal() { document.getElementById('companyModal').classList.add('hidden'); document.getElementById('statusModal').classList.add('hidden'); document.getElementById('extendModal').classList.add('hidden'); document.getElementById('limitModal').classList.add('hidden'); document.getElementById('changePasswordModal').classList.add('hidden'); }
        
        let selectedCompanyId = null;
        function openStatusModal(id, currentStatus) { selectedCompanyId = id; document.getElementById('statusSelect').value = currentStatus; document.getElementById('statusModal').classList.remove('hidden'); }
        async function updateStatus() { const newStatus = document.getElementById('statusSelect').value; try { await apiFetch(`/super-admin/companies/${selectedCompanyId}/status?status=${newStatus}`, { method: 'PATCH' }); showToast('Company status updated'); loadCompanies(currentPage, currentStatusFilter); closeModal(); } catch(e) { showToast(e.message,'error'); } }
        
        function openExtendModal(id) { selectedCompanyId = id; document.getElementById('extendModal').classList.remove('hidden'); }
        async function extendSubscription() { const months = document.getElementById('monthsInput').value; if(!months) return; try { await apiFetch(`/super-admin/companies/${selectedCompanyId}/extend-subscription?months=${months}`, { method: 'POST' }); showToast(`Subscription extended ${months} months`); loadCompanies(currentPage, currentStatusFilter); closeModal(); } catch(e) { showToast(e.message,'error'); } }
        
        function openEmployeeLimitModal(id) { selectedCompanyId = id; document.getElementById('limitModal').classList.remove('hidden'); }
        async function updateEmployeeLimit() { const limit = document.getElementById('limitInput').value; try { await apiFetch(`/super-admin/companies/${selectedCompanyId}/employee-limit?employeeLimit=${limit}`, { method: 'PUT' }); showToast('Employee limit updated'); loadCompanies(currentPage, currentStatusFilter); closeModal(); } catch(e) { showToast(e.message,'error'); } }
        
        async function verifyDocs(id) { try { await apiFetch(`/super-admin/companies/${id}/verify-documents`, { method: 'POST' }); showToast('Documents verified successfully'); loadCompanies(currentPage, currentStatusFilter); } catch(e) { showToast(e.message,'error'); } }
        
        async function createCompany(e) { e.preventDefault(); const payload = { name: document.getElementById('compName').value, email: document.getElementById('compEmail').value, phone: document.getElementById('compPhone').value, address: document.getElementById('compAddress').value, city: document.getElementById('compCity').value, state: document.getElementById('compState').value, country: document.getElementById('compCountry').value, adminFirstName: document.getElementById('adminFname').value, adminLastName: document.getElementById('adminLname').value, adminEmail: document.getElementById('adminEmail').value, employeeLimit: parseInt(document.getElementById('empLimit').value) || 50 }; try { await apiFetch('/super-admin/companies', { method: 'POST', body: JSON.stringify(payload) }); showToast('Company created successfully!'); document.getElementById('createCompanyForm').reset(); closeModal(); loadCompanies(0, currentStatusFilter); } catch(e) { showToast(e.message,'error'); } }
        
        function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); }
        
        // Super Admin Change Password
        async function openSuperAdminChangePwd() { document.getElementById('changePasswordModal').classList.remove('hidden'); }
        async function submitSuperAdminChangePwd() { const current = document.getElementById('superCurrentPwd').value; const newPwd = document.getElementById('superNewPwd').value; const confirm = document.getElementById('superConfirmPwd').value; if (newPwd !== confirm) { showToast('New passwords do not match','error'); return; } try { await apiFetch('/super-admin/change-password', { method: 'PUT', body: JSON.stringify({ currentPassword: current, newPassword: newPwd, confirmPassword: confirm }) }); showToast('Password changed successfully'); closeModal(); document.getElementById('changePwdSuperForm').reset(); } catch(e) { showToast(e.message,'error'); } }
        
        window.onload = () => { loadStats(); loadCompanies(0, ''); };
        window.prevPage = () => { if(currentPage>0) loadCompanies(currentPage-1, currentStatusFilter); };
        window.nextPage = () => { if(currentPage+1 < totalPages) loadCompanies(currentPage+1, currentStatusFilter); };
        window.filterStatus = (s) => { loadCompanies(0, s); };
    </script>
</head>
<body class="flex">
<div class="sidebar w-72 text-white p-5 flex flex-col">
    <div class="flex items-center gap-3 mb-10"><i class="fas fa-crown text-3xl text-yellow-400"></i><span class="text-2xl font-bold">Super Admin</span></div>
    <div class="flex-1 space-y-2"><div class="nav-item p-3 rounded-lg bg-slate-800"><i class="fas fa-building mr-3"></i> Companies</div><div onclick="openSuperAdminChangePwd()" class="nav-item p-3 rounded-lg hover:bg-slate-700 cursor-pointer"><i class="fas fa-key mr-3"></i> Change Password</div></div>
    <button onclick="logout()" class="mt-auto bg-red-700 hover:bg-red-800 p-3 rounded-xl text-left"><i class="fas fa-sign-out-alt mr-2"></i> Logout</button>
</div>
<div class="flex-1 p-6 overflow-auto">
    <div class="flex justify-between items-center mb-6"><h1 class="text-3xl font-bold">Company Management</h1><button onclick="openCreateModal()" class="bg-blue-600 text-white px-5 py-2 rounded-xl shadow"><i class="fas fa-plus mr-2"></i>New Company</button></div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8"><div class="bg-white p-5 rounded-2xl shadow card-hover"><div class="flex justify-between"><span class="text-gray-500">Total Companies</span><i class="fas fa-chart-line text-blue-500 text-2xl"></i></div><div class="text-3xl font-bold" id="totalCompanies">0</div></div><div class="bg-white p-5 rounded-2xl shadow card-hover"><div class="flex justify-between"><span class="text-gray-500">Active</span><i class="fas fa-check-circle text-green-500 text-2xl"></i></div><div class="text-3xl font-bold" id="activeCompanies">0</div></div><div class="bg-white p-5 rounded-2xl shadow card-hover"><div class="flex justify-between"><span class="text-gray-500">Deactivated</span><i class="fas fa-ban text-red-500 text-2xl"></i></div><div class="text-3xl font-bold" id="inactiveCompanies">0</div></div></div>
    <div class="bg-white rounded-2xl shadow p-5 mb-6"><canvas id="statsChart" height="100" width="300" style="max-height:200px"></canvas></div>
    <div class="bg-white rounded-2xl shadow p-5">
        <div class="flex gap-3 mb-4"><button onclick="filterStatus('')" class="px-4 py-1 rounded-full bg-gray-200">All</button><button onclick="filterStatus('ACTIVE')" class="px-4 py-1 rounded-full bg-green-100">Active</button><button onclick="filterStatus('PENDING')" class="px-4 py-1 rounded-full bg-yellow-100">Pending</button><button onclick="filterStatus('SUSPENDED')" class="px-4 py-1 rounded-full bg-red-100">Suspended</button></div>
        <div class="overflow-x-auto"><table class="min-w-full"><thead class="bg-gray-100"><tr><th>Company</th><th>Email</th><th>Emp Limit</th><th>Status</th><th>Docs</th><th>Subscr End</th><th>Actions</th></tr></thead><tbody id="companiesTableBody"></tbody></table></div>
        <div class="flex justify-between items-center mt-5"><button id="prevBtn" onclick="prevPage()" class="px-4 py-2 bg-gray-200 rounded-lg disabled:opacity-50">Previous</button><span id="pageInfo"></span><button id="nextBtn" onclick="nextPage()" class="px-4 py-2 bg-gray-200 rounded-lg">Next</button></div>
    </div>
</div>
<!-- Modals -->
<div id="companyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"><div class="bg-white p-6 rounded-2xl w-96"><h3 id="modalTitle" class="text-xl font-bold mb-3"></h3><div id="companyDetail"></div><button onclick="closeModal()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg">Close</button></div></div>
<div id="statusModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center"><div class="bg-white p-6 rounded-2xl w-80"><h3 class="text-lg font-bold">Change Status</h3><select id="statusSelect" class="w-full border p-2 rounded my-3"><option value="ACTIVE">ACTIVE</option><option value="PENDING">PENDING</option><option value="SUSPENDED">SUSPENDED</option></select><button onclick="updateStatus()" class="bg-blue-600 text-white px-4 py-2 rounded">Update</button><button onclick="closeModal()" class="ml-2">Cancel</button></div></div>
<div id="extendModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center"><div class="bg-white p-6 rounded-2xl w-80"><h3>Extend Subscription (months)</h3><input id="monthsInput" type="number" class="border p-2 w-full my-3" placeholder="e.g., 6"><button onclick="extendSubscription()" class="bg-purple-600 text-white px-4 py-2 rounded">Extend</button><button onclick="closeModal()">Cancel</button></div></div>
<div id="limitModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center"><div class="bg-white p-6 rounded-2xl w-80"><h3>Update Employee Limit</h3><input id="limitInput" type="number" class="border p-2 w-full my-3"><button onclick="updateEmployeeLimit()" class="bg-indigo-600 text-white px-4 py-2 rounded">Update</button><button onclick="closeModal()">Cancel</button></div></div>
<div id="createModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center overflow-auto"><div class="bg-white p-6 rounded-2xl w-full max-w-md my-8"><h2 class="text-xl font-bold mb-4">Create Company + Admin</h2><form id="createCompanyForm" onsubmit="createCompany(event)"><input id="compName" placeholder="Company Name *" class="w-full border p-2 rounded mb-2" required><input id="compEmail" placeholder="Company Email" class="w-full border p-2 rounded mb-2"><input id="compPhone" placeholder="Phone" class="w-full border p-2 rounded mb-2"><input id="compAddress" placeholder="Address" class="w-full border p-2 rounded mb-2"><div class="flex gap-2"><input id="compCity" placeholder="City" class="w-1/2 border p-2 rounded"><input id="compState" placeholder="State" class="w-1/2 border p-2 rounded"></div><input id="compCountry" placeholder="Country" class="w-full border p-2 rounded mb-2"><hr class="my-3"><h3>Company Admin</h3><input id="adminFname" placeholder="First Name *" class="w-full border p-2 rounded mb-2" required><input id="adminLname" placeholder="Last Name *" class="w-full border p-2 rounded mb-2" required><input id="adminEmail" placeholder="Admin Email *" class="w-full border p-2 rounded mb-2" required><input id="empLimit" type="number" placeholder="Employee Limit" class="w-full border p-2 rounded mb-4"><div class="flex gap-2"><button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Create</button><button type="button" onclick="closeModal()" class="bg-gray-400 px-4 py-2 rounded">Cancel</button></div></form></div></div>
<div id="changePasswordModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"><div class="bg-white rounded-2xl w-full max-w-md p-5"><h3 class="text-xl font-bold mb-3"><i class="fas fa-key text-blue-600"></i> Change Password (Super Admin)</h3><form id="changePwdSuperForm" onsubmit="event.preventDefault(); submitSuperAdminChangePwd();"><input type="password" id="superCurrentPwd" placeholder="Current Password" class="w-full border p-2 rounded-lg mb-3" required><input type="password" id="superNewPwd" placeholder="New Password" class="w-full border p-2 rounded-lg mb-3" required><input type="password" id="superConfirmPwd" placeholder="Confirm New Password" class="w-full border p-2 rounded-lg mb-4" required><div class="flex gap-3"><button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded-lg">Update</button><button type="button" onclick="closeModal()" class="flex-1 bg-gray-300 py-2 rounded-lg">Cancel</button></div></form></div></div>
</body>
</html>
