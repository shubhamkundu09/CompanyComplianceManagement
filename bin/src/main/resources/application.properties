# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================================
# JSP / View Resolver
# ==========================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ==========================================
# Static Resources
# ==========================================
spring.web.resources.static-locations=classpath:/static/,classpath:/public/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/static/**

# ==========================================
# JWT Configuration
# ==========================================
jwt.secret=${JWT_SECRET:404E635266556A586E327xhvjxcmhvbjxchv2357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================
# Mail Configuration
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:redcircle0908@gmail.com}
spring.mail.password=${MAIL_PASSWORD:zsvclxfesgbclxnd}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# Logging
# ==========================================
logging.level.com.vnext=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# ==========================================
# Error Handling
# ==========================================
server.error.path=/error
server.error.whitelabel.enabled=false

# ==========================================
# Super Admin Default Credentials
# ==========================================
superadmin.email=${SUPER_ADMIN_EMAIL:admin@gmail.com}
superadmin.password=${SUPER_ADMIN_PASSWORD:admin@123}
superadmin.first-name=System
superadmin.last-name=Administrator



